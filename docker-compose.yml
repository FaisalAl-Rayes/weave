services:
  weave:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3333:3000"
    volumes:
      - .:/app
      - weave_node_modules:/app/node_modules
      - weave_next:/app/.next
    env_file: .env
    environment:
      WATCHPACK_POLLING: "true"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

  splunk:
    image: splunk/splunk:9.4
    platform: linux/amd64
    container_name: weave-splunk
    ports:
      - "8000:8000"
      - "8088:8088"
      - "8089:8089"
    environment:
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_PASSWORD: "${SPLUNK_PASSWORD:-weave123}"
      SPLUNK_LICENSE_URI: "Free"
      SPLUNK_HEC_TOKEN: "weave-hec-token"
      SPLUNK_HEC_SSL: "false"
      SPLUNK_DEFAULTS_URL: "/tmp/defaults/default.yml"
    volumes:
      - ./docker/splunk/defaults.yml:/tmp/defaults/default.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:8089/services/server/health/splunkd/details", "-u", "admin:${SPLUNK_PASSWORD:-weave123}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  splunk-init:
    image: curlimages/curl:latest
    depends_on:
      splunk:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        SPLUNK_PASSWORD="${SPLUNK_PASSWORD:-weave123}"
        HEC_TOKEN="weave-hec-token"

        configure_splunk() {
          local HOST="$$1"
          local SOURCETYPE="$$2"
          local API="https://$${HOST}:8089"

          echo "Configuring $${HOST}..."
          curl -sk -u "admin:$${SPLUNK_PASSWORD}" "$${API}/servicesNS/admin/splunk_httpinput/data/inputs/http/http" -d "disabled=0" -d "enableSSL=0" -o /dev/null
          curl -sk -u "admin:$${SPLUNK_PASSWORD}" "$${API}/servicesNS/admin/search/data/indexes" -d "name=ci_logs" -d "datatype=event" -o /dev/null 2>/dev/null || true
          curl -sk -u "admin:$${SPLUNK_PASSWORD}" "$${API}/servicesNS/admin/splunk_httpinput/data/inputs/http" \
            -d "name=weave" -d "token=$${HEC_TOKEN}" -d "index=ci_logs" -d "indexes=ci_logs" \
            -d "sourcetype=$${SOURCETYPE}" -d "useACK=0" -o /dev/null 2>/dev/null || true
          echo "  $${HOST} configured."
        }

        configure_splunk splunk "kube:pod:logs"
        echo "Splunk configured."

volumes:
  weave_node_modules:
  weave_next:
